# Define the upstream backend servers (Node 2 containers)
upstream backend_servers {
    server 192.168.56.11:8081;
    server 192.168.56.11:8082;
    server 192.168.56.11:8083;
}

server {
    # Listen on port 80 for incoming HTTP traffic
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        # Forward requests to the upstream group
        proxy_pass http://backend_servers;
        
        # Pass original host and client IP headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}